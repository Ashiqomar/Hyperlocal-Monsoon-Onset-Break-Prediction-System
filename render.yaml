# Render Blueprint: backend web service + Postgres. See DEPLOY.md.
services:
  - type: web
    name: monsoon-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: the officer review store is in memory (app/services/review.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: monsoon-db
          property: connectionString
      - key: CORS_ORIGIN_REGEX
        value: "https://.*(\\.onrender\\.com|\\.vercel\\.app)"
      - key: CORS_ORIGINS # optional explicit list, e.g. https://monsoon-frontend.onrender.com
        sync: false
      - key: PUBLIC_APP_URL # URL used in WhatsApp message links
        sync: false

  - type: web
    name: monsoon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE # e.g. https://monsoon-backend.onrender.com (without trailing slash)
        sync: false

databases:
  - name: monsoon-db
    plan: free
