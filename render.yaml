# Render Blueprint: backend web service + Postgres. See DEPLOY.md.
services:
  - type: web
    name: monsoon-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: the officer review store is in memory (app/services/review.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: monsoon-db
          property: connectionString
      # Set these in the dashboard once the Vercel URL is known:
      - key: CORS_ORIGINS # e.g. https://monsoon-twin.vercel.app
        sync: false
      - key: PUBLIC_APP_URL # same Vercel URL (used in WhatsApp message links)
        sync: false
      - key: CORS_ORIGIN_REGEX # optional, e.g. https://monsoon-twin-.*\.vercel\.app for previews
        sync: false

databases:
  - name: monsoon-db
    plan: free
